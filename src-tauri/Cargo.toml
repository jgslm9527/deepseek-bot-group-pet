[package]
name = "deepseek-group-pet"
version = "1.0.0"
description = "DeepSeek Bot Group Pet — local multi-bot AI group chat with a desktop companion"
authors = ["DeepSeek Group Pet"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "deepseek_group_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
